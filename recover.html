<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recover Account - Enter the Realm</title>
    <link href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&family=Cinzel:wght@400;700&family=MedievalSharp&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="bg-video"></div>
    <div class="particles" id="particles"></div>

    <div class="dnd-center">
        <div class="dnd-container">
            <div class="corner-decoration corner-tl"></div>
            <div class="corner-decoration corner-tr"></div>
            <div class="corner-decoration corner-bl"></div>
            <div class="corner-decoration corner-br"></div>

            <div class="dnd-icon">&#128273;</div>
            <h1 class="dnd-title">Recover Account</h1>
            <p class="dnd-subtitle" id="formSubtitle">Answer the Guardian's Riddle</p>

            <div id="message" style="display:none; padding:10px; margin-bottom:15px; border-radius:5px; text-align:center; font-size:14px;"></div>

            <!-- Step 1: enter username to look up the security question -->
            <form id="lookupForm">
                <div class="dnd-form-group">
                    <label class="dnd-label" for="username">Adventurer Name</label>
                    <input class="dnd-input" type="text" id="username" placeholder="Enter your name..." required>
                </div>
                <button type="submit" class="dnd-btn" id="lookupBtn">Find My Riddle</button>
            </form>

            <!-- Step 2: answer the question and set a new password -->
            <form id="resetForm" style="display:none;">
                <div class="dnd-form-group">
                    <label class="dnd-label" id="questionLabel">Your Riddle</label>
                    <input class="dnd-input" type="text" id="securityAnswer" placeholder="Your answer..." required>
                </div>
                <div class="dnd-form-group">
                    <label class="dnd-label" for="newPassword">New Secret Phrase</label>
                    <input class="dnd-input" type="password" id="newPassword" placeholder="At least 6 characters..." required>
                </div>
                <button type="submit" class="dnd-btn" id="resetBtn">Reset Secret Phrase</button>
            </form>

            <div class="dnd-divider"><span>or</span></div>

            <div class="dnd-links">
                <a href="index.html">Remembered your spell? Sign In</a>
            </div>

            <p class="dnd-footer">&#9830; May the dice be ever in your favor &#9830;</p>
        </div>
    </div>

    <script>
        // Particles
        const pc = document.getElementById('particles');
        for (let i = 0; i < 50; i++) {
            const p = document.createElement('div');
            p.classList.add('particle');
            p.style.left = Math.random() * 100 + '%';
            p.style.top  = Math.random() * 100 + '%';
            p.style.animationDelay    = Math.random() * 8 + 's';
            p.style.animationDuration = (Math.random() * 5 + 5) + 's';
            pc.appendChild(p);
        }

        const lookupForm   = document.getElementById('lookupForm');
        const resetForm    = document.getElementById('resetForm');
        const questionLabel = document.getElementById('questionLabel');
        const formSubtitle = document.getElementById('formSubtitle');
        const messageDiv   = document.getElementById('message');
        let currentUsername = '';

        function showMessage(text, ok) {
            messageDiv.style.display    = 'block';
            messageDiv.style.background = ok ? 'rgba(139,195,74,0.2)' : 'rgba(244,67,54,0.2)';
            messageDiv.style.color      = ok ? '#8bc34a' : '#f44336';
            messageDiv.style.border     = ok ? '1px solid #8bc34a' : '1px solid #f44336';
            messageDiv.textContent      = text;
        }

        lookupForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            currentUsername = document.getElementById('username').value.trim();
            const lookupBtn = document.getElementById('lookupBtn');
            const originalText = lookupBtn.textContent;
            lookupBtn.textContent = 'Searching...';
            lookupBtn.disabled = true;

            try {
                const response = await fetch('/api/recover/question', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: currentUsername })
                });
                const data = await response.json();

                if (response.ok) {
                    questionLabel.textContent = data.securityQuestion;
                    formSubtitle.textContent  = 'Answer the Guardian\'s Riddle';
                    lookupForm.style.display = 'none';
                    resetForm.style.display  = 'block';
                    messageDiv.style.display = 'none';
                } else {
                    showMessage(data.error, false);
                }
            } catch (error) {
                showMessage('Connection error. Make sure the server is running.', false);
            }

            lookupBtn.textContent = originalText;
            lookupBtn.disabled = false;
        });

        resetForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const securityAnswer = document.getElementById('securityAnswer').value.trim();
            const newPassword    = document.getElementById('newPassword').value;
            const resetBtn = document.getElementById('resetBtn');
            const originalText = resetBtn.textContent;
            resetBtn.textContent = 'Casting...';
            resetBtn.disabled = true;

            try {
                const response = await fetch('/api/recover/reset', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username: currentUsername, securityAnswer, newPassword })
                });
                const data = await response.json();

                if (response.ok) {
                    showMessage('Secret phrase reset! Redirecting to sign in...', true);
                    setTimeout(() => { window.location.href = 'index.html'; }, 1200);
                } else {
                    showMessage(data.error, false);
                }
            } catch (error) {
                showMessage('Connection error. Make sure the server is running.', false);
            }

            resetBtn.textContent = originalText;
            resetBtn.disabled = false;
        });
    </script>
</body>
</html>
