<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter the Realm - Sign In</title>
    <link href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&family=Cinzel:wght@400;700&family=MedievalSharp&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="bg-video"></div>
    <div class="particles" id="particles"></div>

    <div class="dnd-center">
        <div class="dnd-container">
            <div class="corner-decoration corner-tl"></div>
            <div class="corner-decoration corner-tr"></div>
            <div class="corner-decoration corner-bl"></div>
            <div class="corner-decoration corner-br"></div>

            <div class="dnd-icon" id="formIcon">&#9876;</div>
            <h1 class="dnd-title" id="formTitle">Enter the Realm</h1>
            <p class="dnd-subtitle" id="formSubtitle">Where Legends Are Born</p>

            <div id="message" style="display:none; padding:10px; margin-bottom:15px; border-radius:5px; text-align:center; font-size:14px;"></div>

            <form id="authForm">
                <div class="dnd-form-group">
                    <label class="dnd-label" for="username">Adventurer Name</label>
                    <input class="dnd-input" type="text" id="username" placeholder="Enter your name..." required>
                </div>
                <div class="dnd-form-group">
                    <label class="dnd-label" for="password">Secret Phrase</label>
                    <input class="dnd-input" type="password" id="password" placeholder="Enter your secret..." required>
                </div>
                <div class="dnd-form-group" id="securityGroup" style="display:none;">
                    <label class="dnd-label" for="securityQuestion">Guardian's Riddle</label>
                    <select class="dnd-input" id="securityQuestion">
                        <option value="What was your first pet's name?">What was your first pet's name?</option>
                        <option value="What city were you born in?">What city were you born in?</option>
                        <option value="What is your mother's maiden name?">What is your mother's maiden name?</option>
                        <option value="What was the name of your first school?">What was the name of your first school?</option>
                        <option value="What is your favorite fictional character?">What is your favorite fictional character?</option>
                    </select>
                </div>
                <div class="dnd-form-group" id="securityAnswerGroup" style="display:none;">
                    <label class="dnd-label" for="securityAnswer">Your Answer</label>
                    <input class="dnd-input" type="text" id="securityAnswer" placeholder="Answer for account recovery...">
                </div>
                <button type="submit" class="dnd-btn" id="submitBtn">Begin Quest</button>
            </form>

            <div class="dnd-divider"><span>or</span></div>

            <div class="dnd-links">
                <a href="#" id="toggleLink">New Adventurer? Create Character</a>
                <a href="recover.html">Forgot Your Spell? Recover Account</a>
            </div>

            <p class="dnd-footer">&#9830; May the dice be ever in your favor &#9830;</p>
        </div>
    </div>

    <script>
        // Particles
        const pc = document.getElementById('particles');
        for (let i = 0; i < 50; i++) {
            const p = document.createElement('div');
            p.classList.add('particle');
            p.style.left = Math.random() * 100 + '%';
            p.style.top  = Math.random() * 100 + '%';
            p.style.animationDelay    = Math.random() * 8 + 's';
            p.style.animationDuration = (Math.random() * 5 + 5) + 's';
            pc.appendChild(p);
        }

        let isLoginMode = true;

        const toggleLink   = document.getElementById('toggleLink');
        const formTitle    = document.getElementById('formTitle');
        const formSubtitle = document.getElementById('formSubtitle');
        const formIcon     = document.getElementById('formIcon');
        const submitBtn    = document.getElementById('submitBtn');
        const authForm     = document.getElementById('authForm');
        const messageDiv   = document.getElementById('message');
        const securityGroup       = document.getElementById('securityGroup');
        const securityAnswerGroup = document.getElementById('securityAnswerGroup');
        const securityAnswerInput = document.getElementById('securityAnswer');

        toggleLink.addEventListener('click', function(e) {
            e.preventDefault();
            isLoginMode = !isLoginMode;
            if (isLoginMode) {
                formTitle.textContent    = 'Enter the Realm';
                formSubtitle.textContent = 'Where Legends Are Born';
                formIcon.innerHTML       = '&#9876;';
                submitBtn.textContent    = 'Begin Quest';
                toggleLink.textContent   = 'New Adventurer? Create Character';
                securityGroup.style.display       = 'none';
                securityAnswerGroup.style.display = 'none';
                securityAnswerInput.required       = false;
            } else {
                formTitle.textContent    = 'Join the Realm';
                formSubtitle.textContent = 'Begin Your Legend';
                formIcon.innerHTML       = '&#9878;';
                submitBtn.textContent    = 'Create Character';
                toggleLink.textContent   = 'Already an Adventurer? Sign In';
                securityGroup.style.display       = 'block';
                securityAnswerGroup.style.display = 'block';
                securityAnswerInput.required       = true;
            }
            messageDiv.style.display = 'none';
        });

        authForm.addEventListener('submit', async function(e) {
            e.preventDefault();
            const username     = document.getElementById('username').value.trim();
            const password     = document.getElementById('password').value;
            const originalText = submitBtn.textContent;

            submitBtn.textContent = 'Processing...';
            submitBtn.disabled    = true;

            const endpoint = isLoginMode ? '/api/login' : '/api/register';
            const payload = { username, password };
            if (!isLoginMode) {
                payload.securityQuestion = document.getElementById('securityQuestion').value;
                payload.securityAnswer   = securityAnswerInput.value.trim();
            }

            try {
                const response = await fetch(endpoint, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();

                messageDiv.style.display    = 'block';
                messageDiv.style.background = response.ok ? 'rgba(139,195,74,0.2)' : 'rgba(244,67,54,0.2)';
                messageDiv.style.color      = response.ok ? '#8bc34a' : '#f44336';
                messageDiv.style.border     = response.ok ? '1px solid #8bc34a' : '1px solid #f44336';

                if (response.ok) {
                messageDiv.textContent = data.message;
                localStorage.setItem('dnd_user', username);
                setTimeout(() => {
                window.location.href = 'mode-select.html';  // always
                }, 500);
                } else {
                    messageDiv.textContent = data.error;
                }
            } catch (error) {
                messageDiv.style.display    = 'block';
                messageDiv.style.background = 'rgba(244,67,54,0.2)';
                messageDiv.style.color      = '#f44336';
                messageDiv.style.border     = '1px solid #f44336';
                messageDiv.textContent      = 'Connection error. Make sure the server is running.';
            }

            submitBtn.textContent = originalText;
            submitBtn.disabled    = false;
        });
    </script>
</body>
</html>
