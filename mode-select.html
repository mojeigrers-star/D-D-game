<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Choose Your Path - D&D Realm</title>
    <link href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&family=Cinzel:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <style>
        .mode-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            margin-bottom: 20px;
        }

        .mode-card {
            background: rgba(0, 0, 0, 0.4);
            border: 2px solid #3d2f1f;
            border-radius: 12px;
            padding: 22px 18px;
            cursor: pointer;
            transition: border-color 0.25s, transform 0.2s, background 0.25s;
            position: relative;
        }

        .mode-card:hover {
            border-color: #8b7355;
            background: rgba(0, 0, 0, 0.55);
            transform: translateY(-3px);
        }

        .mode-card.selected {
            border-color: #c9a45c;
            background: rgba(201, 164, 92, 0.08);
            box-shadow: 0 0 20px rgba(201, 164, 92, 0.2);
        }

        .mode-icon {
            font-size: 36px;
            display: block;
            margin-bottom: 10px;
            filter: drop-shadow(0 0 6px rgba(201,164,92,0.4));
        }

        .mode-name {
            font-family: 'Cinzel', serif;
            font-size: 15px;
            font-weight: 700;
            color: #c9a45c;
            margin: 0 0 8px;
            letter-spacing: 1px;
        }

        .mode-desc {
            font-family: 'Cinzel', serif;
            font-size: 12px;
            color: #8b7355;
            line-height: 1.6;
            margin: 0 0 14px;
            font-style: italic;
        }

        .mode-badge {
            display: inline-block;
            font-family: 'Cinzel', serif;
            font-size: 9px;
            letter-spacing: 1px;
            padding: 3px 10px;
            border-radius: 4px;
            text-transform: uppercase;
            background: rgba(50,100,200,0.15);
            color: #8baeee;
            border: 1px solid rgba(50,100,200,0.3);
        }

        .sub-options {
            display: none;
            flex-direction: column;
            gap: 8px;
            margin-top: 14px;
            padding-top: 14px;
            border-top: 1px solid #3d2f1f;
        }

        .sub-options.show { display: flex; }

        .sub-btn {
            font-family: 'Cinzel', serif;
            font-size: 11px;
            letter-spacing: 0.5px;
            padding: 10px 12px;
            border-radius: 6px;
            border: 1px solid #3d2f1f;
            background: rgba(0, 0, 0, 0.3);
            color: #8b7355;
            cursor: pointer;
            text-align: left;
            transition: background 0.15s, color 0.15s, border-color 0.15s;
        }

        .sub-btn:hover {
            background: rgba(201,164,92,0.08);
            color: #c9a45c;
            border-color: #8b7355;
        }

        .sub-btn.chosen {
            background: rgba(201,164,92,0.12);
            color: #c9a45c;
            border-color: #c9a45c;
        }

        .lore-box {
            display: none;
            background: rgba(0, 0, 0, 0.35);
            border-left: 2px solid #c9a45c;
            border-radius: 0 8px 8px 0;
            padding: 12px 16px;
            margin-bottom: 20px;
            font-family: 'Cinzel', serif;
            font-size: 12px;
            font-style: italic;
            color: #8b7355;
            line-height: 1.7;
        }

        .lore-box.show { display: block; }

        .dnd-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
            transform: none !important;
            box-shadow: none !important;
        }

        .dnd-btn:disabled::before { display: none; }

        @media (max-width: 500px) {
            .mode-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="bg-video"></div>
    <div class="particles" id="particles"></div>

    <div class="dnd-center">
        <div class="dnd-container">
            <div class="corner-decoration corner-tl"></div>
            <div class="corner-decoration corner-tr"></div>
            <div class="corner-decoration corner-bl"></div>
            <div class="corner-decoration corner-br"></div>

            <div class="dnd-icon">&#9876;</div>
            <h1 class="dnd-title">Choose Your Path</h1>
            <p class="dnd-subtitle">How Shall Your Legend Unfold?</p>

            <div class="mode-grid">
                <div class="mode-card" id="card-single" onclick="selectMode('single')">
                    <span class="mode-icon">&#9876;</span>
                    <p class="mode-name">Solo Quest</p>
                    <p class="mode-desc">A lone adventurer walks a personal path. Your choices, your fate.</p>
                    <div class="sub-options" id="sub-single">
                        <button class="sub-btn" id="btn-oneshot" onclick="selectSub(event,'oneshot')">
                            &#8982; One-Shot &mdash; ends forever when complete
                        </button>
                        <button class="sub-btn" id="btn-replay" onclick="selectSub(event,'replay')">
                            &#8635; Replayable &mdash; begin again after defeat
                        </button>
                    </div>
                </div>

                <div class="mode-card" id="card-multi" onclick="selectMode('multi')">
                    <span class="mode-icon">&#127963;</span>
                    <p class="mode-name">Realm Online</p>
                    <p class="mode-desc">A living world where many heroes gather. The realm never sleeps.</p>
                    <span class="mode-badge">Always Open</span>
                    <div class="sub-options" id="sub-multi">
                        <button class="sub-btn" id="btn-join" onclick="selectSub(event,'join')">
                            &#9873; Join an existing realm
                        </button>
                        <button class="sub-btn" id="btn-host" onclick="selectSub(event,'host')">
                            &#9820; Host a new realm
                        </button>
                    </div>
                </div>
            </div>

            <div class="lore-box" id="lore"></div>

            <button class="dnd-btn" id="enterBtn" disabled onclick="proceed()">
                Select a path first...
            </button>

            <p class="dnd-footer">&#9830; May the dice be ever in your favor &#9830;</p>
        </div>
    </div>

    <script>
        window.onload = function() {
            if (!localStorage.getItem('dnd_user')) {
                window.location.href = 'index.html';
            }
        };

        const pc = document.getElementById('particles');
        for (let i = 0; i < 50; i++) {
            const p = document.createElement('div');
            p.classList.add('particle');
            p.style.left = Math.random() * 100 + '%';
            p.style.top  = Math.random() * 100 + '%';
            p.style.animationDelay    = Math.random() * 8 + 's';
            p.style.animationDuration = (Math.random() * 5 + 5) + 's';
            pc.appendChild(p);
        }

        const loreText = {
            oneshot : 'This session is bound by fate. When your adventure concludes — in triumph or defeat — the gates close behind you forever. There is no return. Choose wisely, brave soul.',
            replay  : 'The sands of time are merciful. Should you fall, you may rise again from the beginning. Each run is a new chance to forge your legend.',
            join    : 'Step through the portal into a realm already breathing with life. Other adventurers have walked these roads — ally with them, or carve your own path.',
            host    : 'You raise a new banner and open the gates. Heroes from across the land may answer your call at any time and join your realm.'
        };

        const enterText = {
            oneshot : 'Begin the One-Shot',
            replay  : 'Start Adventure',
            join    : 'Enter the Realm',
            host    : 'Open the Gates'
        };

        const destination = {
            oneshot : 'dashboard.html',
            replay  : 'dashboard.html',
            join    : 'lobby.html?action=join',
            host    : 'lobby.html?action=host'
        };

        let currentMode = null;
        let currentSub  = null;

        function selectMode(mode) {
            if (currentMode === mode) return;
            currentMode = mode;
            currentSub  = null;

            const btn = document.getElementById('enterBtn');
            btn.textContent = 'Select a path first...';
            btn.disabled    = true;
            document.getElementById('lore').className = 'lore-box';

            ['single','multi'].forEach(m => {
                document.getElementById('card-' + m).className =
                    'mode-card' + (m === mode ? ' selected' : '');
                document.getElementById('sub-' + m).className =
                    'sub-options' + (m === mode ? ' show' : '');
            });
            ['btn-oneshot','btn-replay','btn-join','btn-host'].forEach(b => {
                document.getElementById(b).className = 'sub-btn';
            });
        }

        function selectSub(e, sub) {
            e.stopPropagation();
            currentSub = sub;

            ['btn-oneshot','btn-replay','btn-join','btn-host'].forEach(b => {
                document.getElementById(b).className = 'sub-btn';
            });
            const idMap = { oneshot:'btn-oneshot', replay:'btn-replay', join:'btn-join', host:'btn-host' };
            document.getElementById(idMap[sub]).className = 'sub-btn chosen';

            const lore = document.getElementById('lore');
            lore.textContent = loreText[sub];
            lore.className   = 'lore-box show';

            const btn = document.getElementById('enterBtn');
            btn.textContent = enterText[sub];
            btn.disabled    = false;
        }

        function proceed() {
            if (!currentSub) return;
            sessionStorage.setItem('dnd_mode', currentMode);
            sessionStorage.setItem('dnd_sub',  currentSub);
            window.location.href = destination[currentSub];
        }
    </script>
</body>
</html>
